
name: AlfredoBot Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

            - name: Find Gradle Wrapper
        run: |
          echo "Checking for gradlew..."
          pwd
          ls -la
          find . -type f -name gradlew

      - name: Build APK
        run: |
          WRAPPER=$(find . -type f -name gradlew -print -quit)
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi
          chmod +x "$WRAPPER"
          "$WRAPPER" assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: AlfredoBot-APK
          path: app/build/outputs/apk/debug/*.apk
